<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg-box: #080A12;
      --border-box: rgba(34, 211, 238, 0.25);
      --halo-glow: rgba(34, 211, 238, 0.45);
      --eye-fill: #080A12;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-box: #0F172A;
        --border-box: rgba(99, 102, 241, 0.35);
        --halo-glow: rgba(99, 102, 241, 0.5);
        --eye-fill: #0F172A;
      }
    }
  </style>
  <defs>
    <!-- Gradiente Prismático Oficial INDI (Azul Índigo a Cian Turquesa) -->
    <linearGradient id="alien-grad" x1="16" y1="8" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Resplandor del Nodo Orbital Superior -->
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </radialGradient>

    <!-- Aura de fondo sutil -->
    <radialGradient id="backdrop-aura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Contenedor Base Cuadrado con Bordes Redondeados (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="var(--bg-box)" stroke="var(--border-box)" stroke-width="2" />
  
  <!-- Aura Luminosa Detrás del Alien -->
  <circle cx="32" cy="34" r="22" fill="url(#backdrop-aura)" />

  <!-- Nodo Orbital Superior (Antena/Orbe Cósmico) -->
  <circle cx="32" cy="11.5" r="4" fill="url(#node-glow)" />

  <!-- Cabeza Alienígena Geométrica Biomórfica Oficial INDI -->
  <path 
    d="M32 17.5C21.8 17.5 15.5 24.8 15.5 35C15.5 45.2 25.5 54.8 32 58.5C38.5 54.8 48.5 45.2 48.5 35C48.5 24.8 42.2 17.5 32 17.5Z" 
    fill="url(#alien-grad)" 
  />

  <!-- Ojo Izquierdo Elíptico Inclinado hacia Adentro -->
  <ellipse 
    cx="25.5" 
    cy="36.5" 
    rx="4.2" 
    ry="7.8" 
    transform="rotate(-26 25.5 36.5)" 
    fill="var(--eye-fill)" 
  />

  <!-- Ojo Derecho Elíptico Inclinado hacia Adentro -->
  <ellipse 
    cx="38.5" 
    cy="36.5" 
    rx="4.2" 
    ry="7.8" 
    transform="rotate(26 38.5 36.5)" 
    fill="var(--eye-fill)" 
  />
</svg>
